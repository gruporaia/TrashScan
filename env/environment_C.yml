name: litter_C
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    # ── Core DL ───────────────────────────────────────────────────────────
    - torch==2.3.1
    - torchvision==0.18.1
    # ── HuggingFace (V-JEPA 2 loading) ────────────────────────────────────
    - transformers>=4.40.0         # AutoModel.from_pretrained for V-JEPA 2
    - huggingface_hub>=0.23.0
    - accelerate>=0.30.0
    - safetensors>=0.4.3
    # ── Detection ─────────────────────────────────────────────────────────
    - ultralytics==8.3.2
    # ── SSL pretraining ───────────────────────────────────────────────────
    - timm==1.0.3                  # ViT-B/16, ResNet-50 architectures
    # ── Data ──────────────────────────────────────────────────────────────
    - pycocotools==2.0.7
    - opencv-python-headless==4.10.0.84
    - pillow==10.4.0
    - albumentations==1.4.10
    # ── Scientific ────────────────────────────────────────────────────────
    - numpy==1.26.4
    - scikit-learn==1.5.1
    - pandas==2.2.2
    - matplotlib==3.9.1
    # ── Utilities ─────────────────────────────────────────────────────────
    - tqdm==4.66.4
    - pyyaml==6.0.1
    - einops==0.8.0
    - mlflow==2.14.1
